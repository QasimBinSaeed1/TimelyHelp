[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timelyhelp"
version = "0.1.0"
description = "Controller-conditioned scheduling of delayed assistance for mobile robots"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.14.1", "PyYAML==6.0.2",
  "torch==2.8.0", "matplotlib==3.9.4", "Pillow==11.1.0",
  "pyparsing==3.2.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]
ticvla = ["huggingface-hub==0.34.4", "safetensors==0.6.2"]

[project.scripts]
timelyhelp = "timelyhelp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timelyhelp = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["native: requires a native simulator installation"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Isaac requires SimulationApp initialization before importing USD/engine modules.
"src/timelyhelp/backends/isaac_worker.py" = ["E402"]
